<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qaraqalpaq tiliniń elektron korpusı v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="d-flex" id="wrapper">
    <div class="bg-dark text-white" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom p-4">
            <h4 class="m-0 fw-bold"><i class="bi bi-cpu text-info"></i> Qaraqalpaq tiliniń elektron korpusı</h4>
        </div>
        <div class="list-group list-group-flush mt-3">
            <a href="#" class="list-group-item active" onclick="showSection('search')"><i class="bi bi-search me-2"></i> Morfologiyalıq izlew</a>
            <a href="#" class="list-group-item" onclick="showSection('ngram')"><i class="bi bi-graph-up me-2"></i> N-Gram analizi</a>
            <a href="#" class="list-group-item" onclick="showSection('words')"><i class="bi bi-card-checklist me-2"></i> Word Results</a>
        </div>
    </div>

    <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
            <span class="navbar-brand mb-0 h1">Elektron korpus baza analizi</span>
            <div id="statusIndicator" class="ms-auto small text-muted">
                <span class="spinner-grow spinner-grow-sm text-success" role="status"></span> Baza júklenbekte...
            </div>
        </nav>

        <div class="container-fluid p-4">
            <section id="section-search" class="content-section">
                <div class="card glass-card border-0 shadow-sm p-4 mb-4">
                    <h3><i class="bi bi-search text-primary"></i> wiki_corpus.xml</h3>
                    <p class="text-muted">Gáp quramında izlew hám detallı morfologiyalıq analiz</p>
                    <div class="row g-2 mt-2">
                        <div class="col-md-7">
                            <input type="text" id="xmlInput" class="form-control" placeholder="Sóz yamasa morfema jazıń...">
                        </div>
                        <div class="col-md-3">
                            <select id="xmlType" class="form-select">
                                <option value="word">Tolıq sóz</option>
                                <option value="lemma">Lemma (tiykar)</option>
                                <option value="pos">Sóz shaqabı (POS)</option>
                                <option value="morph">Morfema</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary w-100" onclick="handleXMLSearch()">Izlew</button>
                        </div>
                    </div>
                </div>

                <div id="xmlOutput" class="row g-3">
                    </div>
            </section>

            <section id="section-ngram" class="content-section d-none">
                <div class="card glass-card border-0 shadow-sm p-4">
                    <h3><i class="bi bi-diagram-3 text-success"></i> N-Gram analizi</h3>
                    <div class="row mt-3">
                        <div class="col-md-8">
                            <input type="text" id="ngramInput" class="form-control" placeholder="So'z birikmasini kiriting...">
                        </div>
                        <div class="col-md-4">
                            <div class="btn-group w-100">
                                <button class="btn btn-outline-success" onclick="handleNGram(2)">2-Gram</button>
                                <button class="btn btn-outline-success" onclick="handleNGram(3)">3-Gram</button>
                                <button class="btn btn-outline-success" onclick="handleNGram(4)">4-Gram</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="ngramOutput" class="mt-4"></div>
            </section>

            <section id="section-words" class="content-section d-none">
                <div class="card glass-card border-0 shadow-sm p-4">
                    <h3><i class="bi bi-file-earmark-text text-warning"></i> Word_results.txt</h3>
                    <p>Bazadagi barlıq qayta islengen sózler dizimi</p>
                    <div id="wordResultsOutput" class="list-group mt-3"></div>
                </div>
            </section>
        </div>
    </div>
</div>

<div class="modal fade" id="analysisModal" tabindex="-1" aria-labelledby="analysisModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header bg-primary text-white" style="border-radius: 20px 20px 0 0;">
                <h5 class="modal-title" id="modalWordTitle">Sóz analizi</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4" id="modalBodyContent">
                </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Jabıw</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
